<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
  <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1830"/><stop offset="1" stop-color="#071120"/></linearGradient>
  <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#f5a623"/></linearGradient>
  <linearGradient id="tShine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="tClip"><rect x="0" y="0" width="900" height="150" rx="14"/></clipPath>
  <style>
    text{fill:#e6f0ff;font-family:'Segoe UI',Arial,sans-serif;font-family:'SFMono-Regular',Consolas,monospace}
    @keyframes pop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
    .cell{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease forwards}
    @keyframes rankglow{0%,100%{opacity:.7}50%{opacity:1}}
    .rk{animation:rankglow 2.4s ease-in-out infinite}
    @keyframes shineX{0%{transform:translateX(-960px)}55%,100%{transform:translateX(960px)}}
    #tsh{animation:shineX 4.5s ease-in-out infinite}
  </style>
</defs>
<g clip-path="url(#tClip)">
  <rect width="900" height="150" fill="url(#tBg)" stroke="#1f4b7a"/>
  <g font-family="'SFMono-Regular',Consolas,monospace">
    <g transform="translate(75,60)"><g class="cell" style="animation-delay:0.10s"><path d="M-18 -22 h36 v10 a18 18 0 0 1 -36 0 z" fill="url(#cup)"/><rect x="-6" y="-4" width="12" height="10" fill="#c47f16"/><rect x="-14" y="6" width="28" height="6" rx="2" fill="#c47f16"/><text class="rk" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd76a">A+</text><text y="52" text-anchor="middle" font-size="11" fill="#9fb6d6">Commits</text></g></g>
    <g transform="translate(225,60)"><g class="cell" style="animation-delay:0.22s"><path d="M-18 -22 h36 v10 a18 18 0 0 1 -36 0 z" fill="url(#cup)"/><rect x="-6" y="-4" width="12" height="10" fill="#c47f16"/><rect x="-14" y="6" width="28" height="6" rx="2" fill="#c47f16"/><text class="rk" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd76a">A</text><text y="52" text-anchor="middle" font-size="11" fill="#9fb6d6">Stars</text></g></g>
    <g transform="translate(375,60)"><g class="cell" style="animation-delay:0.34s"><path d="M-18 -22 h36 v10 a18 18 0 0 1 -36 0 z" fill="url(#cup)"/><rect x="-6" y="-4" width="12" height="10" fill="#c47f16"/><rect x="-14" y="6" width="28" height="6" rx="2" fill="#c47f16"/><text class="rk" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd76a">A</text><text y="52" text-anchor="middle" font-size="11" fill="#9fb6d6">PRs</text></g></g>
    <g transform="translate(525,60)"><g class="cell" style="animation-delay:0.46s"><path d="M-18 -22 h36 v10 a18 18 0 0 1 -36 0 z" fill="url(#cup)"/><rect x="-6" y="-4" width="12" height="10" fill="#c47f16"/><rect x="-14" y="6" width="28" height="6" rx="2" fill="#c47f16"/><text class="rk" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd76a">A</text><text y="52" text-anchor="middle" font-size="11" fill="#9fb6d6">Issues</text></g></g>
    <g transform="translate(675,60)"><g class="cell" style="animation-delay:0.58s"><path d="M-18 -22 h36 v10 a18 18 0 0 1 -36 0 z" fill="url(#cup)"/><rect x="-6" y="-4" width="12" height="10" fill="#c47f16"/><rect x="-14" y="6" width="28" height="6" rx="2" fill="#c47f16"/><text class="rk" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd76a">B+</text><text y="52" text-anchor="middle" font-size="11" fill="#9fb6d6">Followers</text></g></g>
    <g transform="translate(825,60)"><g class="cell" style="animation-delay:0.70s"><path d="M-18 -22 h36 v10 a18 18 0 0 1 -36 0 z" fill="url(#cup)"/><rect x="-6" y="-4" width="12" height="10" fill="#c47f16"/><rect x="-14" y="6" width="28" height="6" rx="2" fill="#c47f16"/><text class="rk" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd76a">A</text><text y="52" text-anchor="middle" font-size="11" fill="#9fb6d6">Contrib</text></g></g>
    </g>
  <rect id="tsh" x="-200" y="0" width="160" height="150" fill="url(#tShine)" opacity="0.5" transform="skewX(-18)"/>
</g>
</svg>
