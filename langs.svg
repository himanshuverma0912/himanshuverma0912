<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
  <linearGradient id="lBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1830"/><stop offset="1" stop-color="#071120"/></linearGradient>
  <style>
    text{fill:#e6f0ff;font-family:'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    @keyframes grow{from{width:0}}
    .bar{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .lbl{opacity:0;animation:fu .5s ease forwards}
  </style>
</defs>
<rect x="1" y="1" width="478" height="208" rx="16" fill="url(#lBg)" stroke="#1f4b7a"/>
<text x="26" y="40" font-size="20" font-weight="700" fill="#7dd3fc">Most Used Languages</text>
<line x1="26" y1="52" x2="454" y2="52" stroke="#1f4b7a"/>
<g transform="translate(26,74)" class="mono" font-size="14">
  <g class="lbl" style="animation-delay:0.15s"><text x="0" y="0" fill="#cfe3ff">Python</text><text x="428" y="0" text-anchor="end" fill="#9fb6d6">58%</text></g>
  <rect x="0" y="8" width="428" height="10" rx="5" fill="#10233d"/>
  <rect class="bar" x="0" y="8" width="248" height="10" rx="5" fill="#3572A5" style="animation-delay:0.15s"/>
  <g class="lbl" style="animation-delay:0.30s"><text x="0" y="36" fill="#cfe3ff">Jupyter Notebook</text><text x="428" y="36" text-anchor="end" fill="#9fb6d6">18%</text></g>
  <rect x="0" y="44" width="428" height="10" rx="5" fill="#10233d"/>
  <rect class="bar" x="0" y="44" width="77" height="10" rx="5" fill="#DA5B0B" style="animation-delay:0.30s"/>
  <g class="lbl" style="animation-delay:0.45s"><text x="0" y="72" fill="#cfe3ff">TypeScript</text><text x="428" y="72" text-anchor="end" fill="#9fb6d6">12%</text></g>
  <rect x="0" y="80" width="428" height="10" rx="5" fill="#10233d"/>
  <rect class="bar" x="0" y="80" width="51" height="10" rx="5" fill="#3178c6" style="animation-delay:0.45s"/>
  <g class="lbl" style="animation-delay:0.60s"><text x="0" y="108" fill="#cfe3ff">Shell</text><text x="428" y="108" text-anchor="end" fill="#9fb6d6">8%</text></g>
  <rect x="0" y="116" width="428" height="10" rx="5" fill="#10233d"/>
  <rect class="bar" x="0" y="116" width="34" height="10" rx="5" fill="#89e051" style="animation-delay:0.60s"/>
  <g class="lbl" style="animation-delay:0.75s"><text x="0" y="144" fill="#cfe3ff">SQL</text><text x="428" y="144" text-anchor="end" fill="#9fb6d6">4%</text></g>
  <rect x="0" y="152" width="428" height="10" rx="5" fill="#10233d"/>
  <rect class="bar" x="0" y="152" width="17" height="10" rx="5" fill="#e38c00" style="animation-delay:0.75s"/>
  </g>
</svg>
